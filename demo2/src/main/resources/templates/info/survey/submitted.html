<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문조사</title>
    <link rel="stylesheet" href="/css/myInfo.css">
</head>
<body>
<div th:replace="/fragments/header.html :: fragment-header"></div>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>설문조사</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a href="/info/staff" class="selected--menu">설문조사 참여하기</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div  ** 이거 통계 보여주는 view도 만들어야 함-->
    <main>
        <h1>설문 응답 결과</h1>
        <div class="split--div"></div>

        <p>응답 내용:</p>
        <ul>
            <li th:each="response, status : ${ansData.responses}"
                th:text="${status.index + 1} + '번 문항: ' + ${response}"></li>
        </ul>
        <p th:text="'응답자 위치: ' + ${ansData.res.location}"></p>
        <p th:text="'응답자 나이: ' + ${ansData.res.age}"></p>
        <p><a th:href="@{/survey/statistic}">설문조사 통계보기</a></p>  <!-- 설문을 다시 시작할 수 있는 링크 -->
    </main>


</div>

<footer>
    <!-- 필요 시 -->
</footer>
</body>
</html>
