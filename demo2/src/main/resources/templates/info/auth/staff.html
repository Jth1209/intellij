<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
  <!-- 세부 메뉴 div-->
  <div class="sub--menu">
    <div class="sub--menu--top">
      <h2>MY</h2>
    </div>
    <!-- 메뉴 -->
    <!-- 선택된 메뉴에 class="selected--menu" 추가해주세요 -->
    <div class="sub--menu--mid">
      <table class="sub--menu--table" border="1">
        <tr>
          <td><a href="/info/staff" class="selected--menu">내 정보 조회</a></td>
        </tr>
        <tr>
          <td><a href="/password">비밀번호 변경</a></td>
        </tr>
      </table>
    </div>
  </div>

  <!-- 메인 div -->
  <main>
    <h1>내 정보 조회</h1>
    <div class="split--div"></div>
    <table border="1" class="input--table">
      <colgroup>
        <col class="col1">
        <col class="col2">
<!--        <col class="col3">-->
<!--        <col class="col4">-->
      </colgroup>
      <tr>
        <th>성명</th>
        <td th:text="${session.authInfo.name}"></td>
      </tr>
      <tr>
        <th>닉네임</th>
        <td th:text="${session.authInfo.nick}"></td>
      </tr>
      <tr>
        <th>이메일</th>
        <td th:text="${session.authInfo.email}"></td>
      </tr>
      <tr>
        <th>권한</th>
        <td th:text="${session.authInfo.role}"></td>
      </tr>
    </table>
    <button type="button" onclick="location.href='/update'" class="btn btn-dark update--button">수정하기</button>
  </main>
</div>



<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
