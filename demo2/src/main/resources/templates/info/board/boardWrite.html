<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">

    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>로그인</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a th:href="@{/board(category='else')}">총 게시판</a></td>
                </tr>
                <tr>
                    <td><a th:href="@{/board(category='잡담')}">잡담글</a></td>
                </tr>
                <tr>
                    <td><a th:href="@{/board(category='정보')}">정보글</a></td>
                </tr>
            </table>
        </div>
    </div>

    <main>
        <h1>게시글 등록</h1>
        <div class="split--div"></div>
        <form id="frm" name="frm" method="post" action="/board/insertBoard.do" enctype="multipart/form-data">
            <table class="board_detail">
                <tr>
                    <td>제목</td>
                    <td><input type="text" id="title" name="title" required/></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <textarea id="contents" name="contents" required></textarea>
                    </td>
                </tr>
            </table>
            <input type="file" id="files" name="files" multiple="multiple">
            <input type="submit" id="submit" value="저장" class="btn">
        </form>
    </main>


</div>
<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
