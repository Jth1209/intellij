<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 입력</title>
    <style>
        .register-form {
            background: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: auto;
        }

        .form-label {
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: inline-block;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .form-control:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.25);
        }

        .text-danger {
            font-size: 0.875rem;
            margin-top: 0.5rem;
            color: #dc3545;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            color: white;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .d-grid {
            display: grid;
            gap: 1rem;
        }

        .mb-3 {
            margin-bottom: 1.5rem;
        }

    </style>
</head>
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>회원가입</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a th:href="@{/register}">회원가입</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div -->
    <main>
        <h1>회원정보 입력</h1>
        <div class="split--div"></div>
        <div class="form-container">
            <form th:action="@{/register/step3}" th:object="${registerRequest}" method="post" class="register-form">
                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" id="email" class="form-control" th:field="*{email}" placeholder="이메일을 입력하세요"
                           required>
                    <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input type="text" id="name" class="form-control" th:field="*{name}" placeholder="이름을 입력하세요"
                           required>
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <!-- Nickname -->
                <div class="mb-3">
                    <label for="nick" class="form-label">닉네임</label>
                    <input type="text" id="nick" class="form-control" th:field="*{nick}" placeholder="닉네임을 입력하세요"
                           required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nick')}" th:errors="*{nick}"></div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" class="form-control" th:field="*{password}"
                           placeholder="비밀번호를 입력하세요" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="form-control" th:field="*{confirmPassword}"
                           placeholder="비밀번호를 다시 입력하세요" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <!-- Submit Button -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">제출</button>
                </div>
            </form>

        </div>
    </main>
</div>


<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
