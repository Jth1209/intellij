<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>MY</h2>
        </div>
        <!-- 메뉴 -->
        <!-- 선택된 메뉴에 class="selected--menu" 추가해주세요 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a href="/myinfo" class="selected--menu">내 정보 조회</a></td>
                </tr>
                <tr>
                    <td><a href="/edit/changePassword">비밀번호 변경</a></td>
                </tr>
                <tr>
                    <td><a href="/admin" class="selected--menu">사용자 관리</a></td>
                </tr>
                <tr>
                    <td><a href="/shipments" class="selected--menu">물품 관리</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div -->
    <main>
        <h1>유저 관리</h1>
        <div class="split--div"></div>

        <!-- admin 역할일 때만 표시 -->
<!--        <div th:if="${#lists.isEmpty(session.authInfo) && session.authInfo == 'admin'}">-->
<!--            <h2>등록된 상품</h2>-->

            <!-- 상품이 있을 때 -->
            <table th:if="${session.authInfo.role.equals('ADMIN')}" class="input--table">
                <thead>
                <tr>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>이메일</th>
                    <th>가입일</th>
                    <th>삭제여부</th>
                </tr>
                </thead>
                <tbody>
                <!-- 멤버 리스트를 반복 출력 -->
                <tr th:if="${#lists.size(members) > 0}" th:each="member : ${members}">
                    <td th:text="${member.id}"></td>
                    <td th:text="${member.username}"></td>
                    <td th:text="${member.email}"></td>
                    <td th:text="${member.regdate}"></td>
                    <!-- 삭제 버튼, 멤버 ID를 URL 경로에 포함 -->
                    <td>
                        <form th:action="@{/admin/delete/{id}(id=${member.id})}" method="post"
                              onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <button type="submit">삭제</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        <!-- admin이 아닐 경우 접근 불가 메시지 -->
        <div th:unless="${session.authInfo.role.equals('ADMIN')}">
            <p>이 페이지는 관리자만 접근 가능합니다.</p>
        </div>
    </main>


</div>



<footer>
    <!-- 필요 시 -->
</footer>

</div>

</body>
</html>
