<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설문조사</title>
    <link rel="stylesheet" href="/css/myInfo.css">
    <style>
        .survey-form {
            width: 100%;
            max-width: 600px;
            background-color: #fff;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .survey-form h1 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
            color: #343a40;
        }

        .survey-item {
            margin-bottom: 1.5rem;
        }

        .survey-item label {
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: block;
            color: #495057;
        }

        .survey-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .survey-options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
        }

        .survey-options input[type="radio"] {
            margin: 0;
            transform: scale(1.2);
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-top: 0.5rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .extra-info {
            margin-top: 1rem;
        }

        .extra-info label {
            font-weight: bold;
            margin-bottom: 0.5rem;
            display: block;
            color: #495057;
        }

        .extra-info input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        .extra-info input:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }
    </style>

</head>
<body>
<div th:replace="/fragments/header.html :: fragment-header"></div>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>설문조사</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a href="/info/staff" class="selected--menu">설문조사 참여하기</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div  ** 이거 통계 보여주는 view도 만들어야 함-->
    <main>
        <h1>설문조사: 서비스 만족도</h1>
        <div class="split--div"></div>
        <form th:action="@{/submitted.do}" method="post" class="survey-form">
            <!-- 설문 항목 -->
            <div th:each="q, stat : ${questions}" class="survey-item">
                <label th:text="${stat.index + 1} + '. ' + ${q.title}"></label>

                <!-- 선택형 질문 -->
                <div th:if="${q.choice}" class="survey-options">
                    <div th:each="option : ${q.options}">
                        <label>
                            <input type="radio" th:name="'responses[' + ${stat.index} + ']'" th:value="${option}" required/>
                            <span th:text="${option}"></span>
                        </label>
                    </div>
                </div>

                <!-- 텍스트 입력 질문 -->
                <div th:if="${!q.choice}">
                    <input type="text" th:name="'responses[' + ${stat.index} + ']'" placeholder="응답을 입력하세요">
                </div>
            </div>

            <!-- 응답자 추가 정보 -->
            <div class="extra-info">
                <label for="location">기타 질문: 설문자님의 거주 지역을 입력해주세요</label>
                <input type="text" id="location" name="res.location" placeholder="위치를 입력하세요">
            </div>
            <div class="extra-info">
                <label for="age">기타 질문: 설문자님의 나이를 입력해주세요</label>
                <input type="text" id="age" name="res.age" placeholder="나이를 입력하세요">
            </div>
            <br>
            <!-- 제출 버튼 -->
            <button type="submit" class="btn">전송</button>
        </form>

    </main>

</div>

<footer>
    <!-- 필요 시 -->
</footer>
</body>
</html>
