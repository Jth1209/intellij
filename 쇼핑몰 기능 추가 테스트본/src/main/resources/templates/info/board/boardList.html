<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/boardList.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">

    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>로그인</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a th:href="@{/board/openBoardList.do}">총 게시판</a></td>
                </tr>
            </table>
        </div>
    </div>

    <main>
        <h1>게시판</h1>
        <div class="split--div"></div>

        <form th:action="@{/board/openBoardList.do}" method="get" class="form--container">
            <select class="input--box" name="type">
                <option value="all">전체</option>
                <option value="common">잡담</option>
                <option value="info">정보</option>
            </select>
            <input type="text" name="keyword" class="input--box" placeholder="검색어를 입력하세요">
            <input type="submit" class="button" value="검색">
        </form>

        <table border="1" class="input--table">
            <thead th:unless="${list == null or list.isEmpty()}">
            <tr>
                <th>글 번호</th>
                <th>제목</th>
                <th>작성자</th>
                <th>조회수</th>
            </tr>
            </thead>
            <tbody>
            <div th:if="${#lists.size(list) > 0}" th:each="list : ${list}">

                <tr>
                    <td th:text="${list.boardIdx}"></td>
                    <td class="title"><a href="/board/openBoardDetail.do?boardIdx="
                                         th:attrappend="href=${list.boardIdx}"
                                         th:text="${list.title}"></a></td>
                    <td th:text="${list.creatorId}"></td>
                    <td th:text="${list.hitCnt}"></td>
                </tr>
            </div>
            <div th:if="${list == null or list.isEmpty()}">
                <p class="no-products">게시물이 존재하지 않거나, 검색한 게시물을 찾을 수 없습니다. <br> 게시물을 작성해보세요!</p>
            </div>
            </tbody>
        </table>
        <br><br>
        <a th:href="@{/board/openBoardWrite.do}" class="btn btn-dark">새 글 작성</a>
        <br>

        <div th:if="${!list.isEmpty()}">
            <!-- 전역 변수 선언 -->
            <nav
                    th:with="pageNumber = ${list.pageable.pageNumber}, pageSize = ${list.pageable.pageSize}, totalPages = ${list.totalPages}, startPage = ${T(java.lang.Math).floor(pageNumber / pageSize) * pageSize + 1}, tempEndPage = ${startPage + pageSize - 1}, endPage = (${tempEndPage < totalPages ? tempEndPage : totalPages})"
                    aria-label="Page navigation"
                    class="pagination-nav"
            >
                <ul class="pagination">
                    <!-- 처음으로 이동 -->
                    <li th:classappend="${pageNumber < pageSize} ? 'disabled'" class="page-item">
                        <a class="page-link" th:href="@{/board/openBoardList.do(page=0)}">
                            <span>&laquo;</span>
                            <span class="sr-only">First</span>
                        </a>
                    </li>

                    <!-- 이전으로 이동 -->
                    <li th:classappend="${list.first} ? 'disabled'" class="page-item">
                        <a class="page-link"
                           th:href="${list.first} ? '#' : @{/board/openBoardList.do(page=${pageNumber - 1})}"
                           aria-label="Previous">
                            <span aria-hidden="true">&lt;</span>
                            <span class="sr-only">Previous</span>
                        </a>
                    </li>

                    <!-- 특정 페이지로 이동 -->
                    <li th:each="page: ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${page == pageNumber + 1} ? 'active'" class="page-item">
                        <a th:text="${page}" class="page-link"
                           th:href="@{/board/openBoardList.do(page=${page - 1})}"></a>
                    </li>

                    <!-- 다음으로 이동 -->
                    <li th:classappend="${list.last} ? 'disabled'" class="page-item">
                        <a class="page-link"
                           th:href="${list.last} ? '#' : @{/board/openBoardList.do(page=${pageNumber + 1})}"
                           aria-label="Next">
                            <span aria-hidden="true">&gt;</span>
                            <span class="sr-only">Next</span>
                        </a>
                    </li>

                    <!-- 마지막으로 이동 -->
                    <li th:classappend=" ${T(java.lang.Math).floor(totalPages / pageSize) * pageSize - 1 <= startPage} ? 'disabled'"
                        class="page-item">
                        <a class="page-link" th:href="@{/board/openBoardList.do(page=${totalPages - 1})}">
                            <span>&raquo;</span>
                            <span class="sr-only">Last</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </main>
</div>
<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
