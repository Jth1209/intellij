        /* 각 테이블 컨테이너 */
        .main--page--notice,

            flex: 1;
            max-width: 50%;
            box-sizing: border-box;
        }

        .main--page--notice table,
        .main--page--calander table {
            width: 100%;
            border-collapse: collapse;
        }

        .main--page--notice th,
        .main--page--notice td,
        .main--page--calander th,
        .main--page--calander td {
            padding: 10px;
            text-align: left;
        }

        .main--page--notice th,
        .main--page--calander th {
            background-color: #f2f2f2;
        }

        .main--page--notice table th,
        .main--page--notice table td {
            width: 33.33%; /* 3개의 셀이 균등한 공간 차지 */
            padding: 10px; /* 가운데 정렬 */
            border: 1px solid #ddd;
            box-sizing: border-box;
            overflow: hidden; /* 내용이 넘칠 경우 숨김 처리 */
            text-overflow: ellipsis; /* 내용이 길 경우 생략 (...) 처리 */
            white-space: nowrap; /* 텍스트가 한 줄에 표시되도록 */
