<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>회원가입</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a th:href="@{/register}">회원가입</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div -->
    <main>
        <form th:action="@{/register/step3}" th:object="${registerRequest}" method="post">
            <p>
                <label>
                    <span>Email</span>:<br>
                    <input type="text" th:field="*{email}"/>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </label>
            </p>
            <p>
                <label>
                    <span>Name</span>:<br>
                    <input type="text" th:field="*{name}"/>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </label>
            </p>
            <p>
                <label>
                    <span>Nickname</span>:<br>
                    <input type="text" th:field="*{nick}"/>
                    <div th:if="${#fields.hasErrors('nick')}" th:errors="*{nick}"></div>
                </label>
            </p>
            <p>
                <label>
                    <span>Password</span>:<br>
                    <input type="password" th:field="*{password}"/>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </label>
            </p>
            <p>
                <label>
                    <span>Confirm Password</span>:<br>
                    <input type="password" th:field="*{confirmPassword}"/>
                    <div th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </label>
            </p>
            <input type="submit" th:value="제출"/>
        </form>
    </main>
</div>


<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
