<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">
    <!-- 세부 메뉴 div-->
    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>로그인</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a href="/info/staff">내 정보 조회</a></td>
                </tr>
                <tr>
                    <td><a th:href="@{/edit/changePassword}">비밀번호 변경</a></td>
                </tr>
            </table>
        </div>
    </div>

    <!-- 메인 div -->
    <main>
        <h1>비밀번호 변경</h1>
        <div class="split--div"></div>
        <form th:action="@{/edit/changePassword}" th:object="${command}" method="post">
            <div th:if="${#fields.hasErrors('*')}">
                <p th:each="error : ${#fields.errors('*')}" th:text="${error}"></p>
            </div>
            <p>
                <label>
                    <span th:text="${#messages.msg('currentPassword')}">Current Password:</span><br>
                    <input type="password" th:field="*{currentPassword}" />
                    <div th:if="${#fields.hasErrors('currentPassword')}" th:each="error : ${#fields.errors('currentPassword')}" th:text="${error}"></div>
                </label>
            </p>
            <p>
                <label>
                    <span th:text="${#messages.msg('newPassword')}">New Password:</span><br>
                    <input type="password" th:field="*{newPassword}" />
                    <div th:if="${#fields.hasErrors('newPassword')}" th:each="error : ${#fields.errors('newPassword')}" th:text="${error}"></div>
                </label>
            </p>
            <input type="submit" th:value="${#messages.msg('change.btn')}" />
        </form>
    </main>
</div>




<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
