<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <style>
        .board_detail {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }

        .board_detail caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px 0;
        }

        .board_detail th,
        .board_detail td {
            padding: 10px;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .view_text textarea {
            width: 100%;
            height: 150px;
            border-radius: 4px;
        }

        /* 첨부파일 리스트 */
        .file-list {
            margin-top: 20px;
        }

        .file-list h4 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .file-item {
            margin-bottom: 10px;
        }

        .file-item a {
            color: #007bff;
            text-decoration: none;
        }

        .file-item a:hover {
            text-decoration: underline;
        }

        /* 이미지 리스트 */
        .image-list {
            margin-top: 20px;
        }

        .image-list h4 {
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        .image-item {
            display: inline-block;
            margin: 10px;
            text-align: center;
        }

        .image-item img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 5px;
        }

        /* 댓글 영역 */
        .comment-section {
            margin-top: 40px;
        }

        .comment-form textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 10px;
        }

        .comment-form button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .comment-form button:hover {
            background-color: #0056b3;
        }

        /* 버튼 스타일 */
        .btn {
            display: inline-block;
            padding: 8px 16px;
            text-align: center;
            border-radius: 4px;
            font-size: 14px;
            margin: 5px;
            cursor: pointer;
        }

        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }

        .btn-primary {
            background-color: #007bff;
            color: white;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
        }

        .btn:hover {
            opacity: 0.8;
        }

    </style>
</head>

<div th:replace="/fragments/header.html :: fragment-header"></div>
<body>
<div th:replace="/fragments/nav.html :: fragment-nav"></div>
<link rel="stylesheet" href="/css/myInfo.css">

<!-- 세부 메뉴 + 메인 -->
<div class="d-flex justify-content-center align-items-start" style="min-width: 100em;">

    <div class="sub--menu">
        <div class="sub--menu--top">
            <h2>로그인</h2>
        </div>
        <!-- 메뉴 -->
        <div class="sub--menu--mid">
            <table class="sub--menu--table" border="1">
                <tr>
                    <td><a th:href="@{/board/openBoardList.do}">총 게시판</a></td>
                </tr>
                <tr>
                    <td><a th:href="@{/board/openCommonBoardList.do}">잡담글</a></td>
                </tr>
                <tr>
                    <td><a th:href="@{/board/openInfoBoardList.do}">정보글</a></td>
                </tr>
            </table>
        </div>
    </div>

    <main>
        <h1>게시판 상세 내용</h1>
        <div class="split--div"></div>

        <form id="frm" method="post">
            <table class="board_detail">
                <colgroup>
                    <col width="15%"/>
                    <col width="35%"/>
                    <col width="15%"/>
                    <col width="35%"/>
                </colgroup>
                <caption>게시글 상세내용</caption>

                <tbody>
                <tr>
                    <th scope="row">글 번호</th>
                    <td th:text="${board.boardIdx}"></td>
                    <th scope="row">조회수</th>
                    <td th:text="${board.hitCnt}"></td>
                </tr>
                <tr>
                    <th scope="row">작성자</th>
                    <td th:text="${board.creatorId}"></td>
                    <th scope="row">작성일</th>
                    <td th:text="${board.createdDatetime}"></td>
                </tr>
                <tr th:if="${uname == board.creatorId}">
                    <th scope="row">제목</th>
                    <td colspan="3">
                        <input type="text" id="titleT" name="title" th:value="${board.title}" class="form-control"/>
                    </td>
                </tr>
                <tr th:if="${uname == board.creatorId}">
                    <td colspan="4" class="view_text">
                        <textarea title="내용" id="contentsT" name="contents" class="form-control" rows="6" th:text="${board.contents}"></textarea>
                    </td>
                </tr>
                <tr th:unless="${uname == board.creatorId}">
                    <th scope="row">제목</th>
                    <td colspan="3">
                        <input type="text" id="title" name="title" th:value="${board.title}" readonly class="form-control"/>
                    </td>
                </tr>
                <tr th:unless="${uname == board.creatorId}">
                    <td colspan="4" class="view_text">
                        <textarea title="내용" id="contents" name="contents" class="form-control" rows="6" th:text="${board.contents}" readonly></textarea>
                    </td>
                </tr>
                </tbody>
            </table>
            <input type="hidden" id="boardIdx" name="boardIdx" th:value="${board.boardIdx}">
        </form>

        <!-- 첨부파일 리스트 -->
        <div class="file-list">
            <h4>첨부파일</h4>
            <div th:each="list : ${board.fileList}" class="file-item">
                <p>
                    <a th:href="@{/board/downloadBoardFile.do(idx=${list.idx}, boardIdx=${list.boardIdx})}"
                       th:text="|${list.originalFileName} (${list.fileSize} kb) 다운로드|"></a>
                </p>
            </div>
        </div>

        <!-- 이미지 파일 -->
        <div class="image-list">
            <h4>첨부된 이미지</h4>
            <div th:each="list : ${board.fileList}" th:if="${list.storedFilePath.endsWith('.jpg') or list.storedFilePath.endsWith('.png') or list.storedFilePath.endsWith('.gif')}" class="image-item">
                <img th:src="${list.storedFilePath}" alt="게시글 이미지" class="post-image"/>
            </div>
        </div>

        <!-- 댓글 작성 폼 -->
        <div class="comment-section">
            <h3>댓글</h3>
            <div class="comment-form">
                <form th:action="@{/comment/{id}(id=${board.boardIdx})}" method="post">
                    <textarea name="content" rows="4" placeholder="댓글을 작성하세요." required class="form-control"></textarea>
                    <button type="submit" class="btn btn-dark">댓글 작성</button>
                    <div th:if="${#lists.isEmpty(board.comments)}" th:each="comment : ${board.comments}">
                        <table>
                            <tr>
                                <td class="" th:text="${comment.nick}"></td>
                                <td th:text="${comment.createdTime}"/>
                            </tr>
                            <tr>
                                <td th:text="${comment.content}"></td>
                                <div th:if="${session.authInfo.id.equals(comment.id)}">

                                </div>
                            </tr>
                        </table>
                    </div>
                </form>
            </div>
        </div>

        <!-- 관리자가 아닌 경우 -->
        <div th:unless="${uname == board.creatorId}">
            <a href="#this" id="listF" class="btn btn-secondary">목록으로</a>
        </div>

        <!-- 관리자인 경우 -->
        <div th:if="${uname == board.creatorId || session.authInfo.role.equals('ADMIN')}">
            <a href="#this" id="listT" class="btn btn-secondary">목록으로</a>
            <a href="#this" id="edit" class="btn btn-primary">수정하기</a>
            <a href="#this" id="delete" class="btn btn-danger">삭제하기</a>
        </div>


        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
        <script type="text/javascript">
            $(document).ready(function () {
                $("#listT").on("click", function () {
                    location.href = "/board/openBoardList.do";
                });

                $("#listF").on("click", function () {
                    location.href = "/board/openBoardList.do";
                });

                $("#edit").on("click", function () {//이후에 수정하기는 따로 수정 페이지를 만들어서 수정하기로 수정.
                    var frm = $("#frm")[0];
                    frm.action = "/board/updateBoard.do";
                    frm.submit();
                });

                $("#delete").on("click", function () {
                    var frm = $("#frm")[0];
                    frm.action = "/board/deleteBoard.do";
                    frm.submit();
                });
            });
        </script>
</main>
</div>
<div th:replace="/fragments/footer.html :: fragment-footer"></div>
</body>
</html>
